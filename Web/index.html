<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>p2unk_db</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#E6F3FF">

    <img loading="lazy">
    <style>
        *{
            max-width:100%;
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:-apple-system;
            background:#f2f2f7;
            margin:0;
            padding:0;
            overflow-x:hidden;
            touch-action: pan-y;
            overscroll-behavior: none;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }
        
        .hidden{
            display:none !important;
        }

        .deck{
            display:flex;
            align-items:stretch;
            width:100%;
            padding:10px;
            background:#fff;
            border-radius:10px;
            margin-bottom:10px;
            gap:10px;
        }

        .deckLeader{
            width:70px;
            height:98px;
            object-fit:cover;
            border-radius:6px;
            flex-shrink:0;
        }
        
        .deckRight{
            flex:1;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
        }

        .deckName{
            font-size:16px;
            font-weight:bold;
            text-align:right;
        }

        .deckButtons{
            display:flex;
            justify-content:flex-end;
            gap:6px;
        }

        .deckButtons button{
            padding:6px 10px;
            font-size:12px;
            border:none;
            border-radius:6px;
            background:#007aff;
            color:#fff;
        }

        .deckButtons .danger{
            background:#e74c3c;
        }

        #list{
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .grid{
            display:grid;
            gap:4px;
            padding:4px;
            box-sizing:border-box;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }


        .cardListGrid{
            display:grid;
            gap:4px;
            padding:4px;
            box-sizing:border-box;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        .card img{
            width:100%;
            aspect-ratio: 120 / 168;
            object-fit:cover;
            position:relative;
            z-index:1;
            image-rendering:auto;
        }

        .card::before{
            content:"";
            position:absolute;
            inset:0;
            border-left:2px solid var(--c1);
            border-right:2px solid var(--c2,var(--c1));
            border-top:2px solid var(--c1);
            border-bottom:2px solid var(--c2,var(--c1));
            border-radius:8px;
            pointer-events:none;
        }

        .card > *{
            position:relative;
        }

        .card{
            position:relative;
            width:100%;
            aspect-ratio: 120/168;
            touch-action: pan-y;
        }

        #edit{
            display:flex;
            flex-direction:column;
            height:100vh;
        }

        .selectedWrap{
            display:block;
            overflow:visible;
            background:#e5dccb;
        }

        .selectedScroll{
            display:grid;
            grid-template-columns:repeat(7, 1fr);
            padding:8px;
        }

        .selectedScroll .card{
            width:100%;
            aspect-ratio:120/168;
        }

        .selectedWrap .card{
            width:100%;
            aspect-ratio:120/168;
        }

        .selectedWrap::-webkit-scrollbar{
            height:10px;
        }
        
        .selectedWrap::-webkit-scrollbar-thumb{
            background:#ccc;
            border-radius:3px;
        }
        
        #leaderFixed{
            position:relative;
            width:100%;
            height:90px;
            overflow:hidden;
            border-radius:10px;
        }

        #leaderFixed img{
            width:100%;
            height:100%;
            object-fit:cover;
            object-position:center 96%;
        }

        #leaderFixed span{
            position:absolute;
            bottom:6px;
            left:10px;
            color:#fff;
            font-weight:bold;
        }

        .listArea{
            flex:1;
            padding: 0 2px 80px;
            box-sizing: border-box;
            overflow:auto;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        .footer{
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            height:80px;
            display:flex;
            gap:6px;
            padding:6px;
            background:#fff;
            z-index:10;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }
        
        .footer button{
            flex:1;
            min-height:44px;
            padding:10px;
            font-size:14px;
            border:none;
            border-radius:10px;
            background:#007aff;
            color:#fff;
        }
        
        #popup{
            position:fixed;
            bottom:-100%;
            width:100%;
            height:65%;
            background:#fff;
            border-radius:20px 20px 0 0;
            transition:.3s;
            padding:10px;
            overflow:auto;
            z-index:10;
        }

        #popup.show{
            bottom:0;
        }
        
        #popup_list{
            position:fixed;
            bottom:-100%;
            width:100%;
            height:65%;
            background:#fff;
            border-radius:20px 20px 0 0;
            transition:.3s;
            padding:10px;
            overflow:auto;
            z-index:10;
        }

        #popup_list.show{
            bottom:0;
        }

        #viewer{
            position:fixed;
            inset:0;
            background:#0008;
            display:none;
            align-items:center;
            justify-content:center;
            opacity:0;
            pointer-events:none;
            transition:.2s;
            z-index:9;
        }

        #viewer.show{
            opacity:1;
            pointer-events:auto;
            display:flex;
        }

        #viewerContent{
            transform:scale(0.8);
            transition:.2s;
            transform:none;
        }

        #viewer.show #viewerContent{
            transform:scale(1);
        }

        #viewer .card{
            width:70vw;
            max-width:320px;
            height:auto;
            aspect-ratio:120/168;
        }
        
        .viewerWrap{
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .navBtn{
            min-height:44px;
            position:absolute;
            top:50%;
            transform:translateY(-50%);
            font-size:34px;
            background:#000a;
            color:#fff;
            border:none;
            width:40px;
            border-radius:50%;
        }

        .prev{
            left:-60px;
        }
        
        .next{
            right:-60px;
        }

        .closeBtn{
            position:absolute;
            top:-60px;
            right:0;
            background:#000a;
            color:#ff0000;
            border:none;
            width:60px;
            min-height:60px;
            border-radius:50%;
            font-size:34px;
        }

        input{
            width:100%;
            padding:6px;
            margin-bottom:10px;
            border-radius:6px;
            border:1px solid #ccc;
        }

        .addBtn{
            position:absolute;
            width:54px;
            height:54px;
            font-size:34px;
            border:none;
            border-radius:50%;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            bottom:4px;
            right:4px;
            background:#28a745;
            z-index:2;
        }

        .removeBtn{
            position:absolute;
            width:54px;
            height:54px;
            font-size:34px;
            border:none;
            border-radius:50%;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            bottom:4px;
            left:4px;
            background:#dc3545;
            z-index:2;
        }

        #start{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
        }

        #start button{
            min-height:44px;
            padding:20px 40px;
            font-size:14px;
            border:none;
            border-radius:12px;
            background:#007aff;
            color:#fff;
        }

        .chips{display:flex;flex-wrap:wrap;gap:6px;}
        .chip{padding:6px;border-radius:6px;background:#ddd;}
        .chip.active{background:#007aff;color:#fff;}

        .count{
            position:absolute;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);        
            background:rgba(0,0,0,0.6);
            color:#fff;
            font-size:34px;
            padding:6px 12px;
            border-radius:10px;
            z-index:3;
            pointer-events:none;
        }
        
        .selectedScroll .count{
            font-size:13px;
            padding:2px 6px;
        }

        .deckCount{
            position:absolute;
            left:15%;
            top:30%;
            transform:translate(-50%,-50%);
            background:rgba(128,128,128);
            color:#fff;
            font-size:22px;
            padding:3px 9px;
            border-radius:10px;
            z-index:3;
            pointer-events:none;
        }

        .deckPreview{
            display:grid;
            gap:4px;
            grid-template-columns: 70px 1fr;
            width:100%;
            max-width:100%;
            background:#e5dccb;
            padding:4px;
            padding-bottom:4px;
            box-sizing:border-box;
            height:auto;
        }

        .deckScaleWrap{
            width:100%;
            transform:none;
        }

        .leaderArea{
            width:56px;
        }

        .leaderArea img{
            width:100%;
            height:auto;
            border-radius:8px;
        }

        .deckGrid{
            display:grid;
            grid-template-columns:repeat(10,1fr);
            gap:0px 0px;
            align-content:start;
            overflow:visible;
        }

        .deckGrid img{
            width:100%;
            aspect-ratio:120/168;
            object-fit:cover;
            border-radius:4px;
        }

        #deckView{
            position:fixed;
            inset:0;
            background:#fff;
            z-index:10000;
            display:none;
            flex-direction:column;
        }

        #deckView.show{
            display:flex;
        }

        .deckViewContent{
            flex:1;
            padding: 0 8px 80px;
            display:flex;
            flex-direction:column;
            gap:10px;
            background:#f5f5f5;
            overflow:auto;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        /* デッキ画像 */
        #deckImage{
            width:100%;
            display:block;
            overflow:visible;
        }

        /* 名前 */
        #deckNameInput{
            font-size:16px;
            padding:10px;
        }

        #deckView .card::before{
            display:none !important;
        }

        .analysisBox{
            margin-top:10px;
            padding:10px;
            border-radius:10px;
            background:#f5f5f5;
            min-height:80px;
            width:100%;
            box-sizing:border-box;
            word-break:break-word;
        }

        .costChart{
            min-width:320px;
        }
        
    </style>

<body>

<!-- START -->
    <div id="start">
        <button onclick="initApp()">START</button>
    </div>

<!-- TOP -->
    <div id="top" class="hidden">
        <div style="padding:10px">
            <h3>デッキ一覧</h3>
            <div id="list" class="grid"></div>
        </div>

        <div id="topFooter" class="footer">
            <button onclick="importDeck()">インポート</button>

                <div id="leaderColorChips" class="chips"></div>

<script>

// ===== ローカル保存 =====
    const STORAGE_KEY = "deckAppData";
    const imageCache = new Map();

// ===== 色 =====
    const COLORS = [
        "赤","青","緑","黄","紫","黒"
    ];

// ===== 並び順 =====
    const TYPE_ORDER = {
        "CHARACTER": 0,
        "EVENT": 1,
        "STAGE": 2
    };

// ===== カードリスト =====
    const leader_list = CARD_DATA.filter(c => c.type === "LEADER");
    const card_list = CARD_DATA.filter(c => c.type !== "LEADER");

// ===== 枚数制限突破カード =====
    const SPECIAL_LIMIT = {
        "OP01-075": 50,
        "OP08-072": 50,
        "OP16-042": 50
    };

// ===== state =====
    let counts={};
    let data=[];
    let current=null;
    let name="";
    let sortMode=0;
    let regulationFilter=new Set();
    let colorFilter=new Set();
    let costFilter=new Set();
    let powerFilter=new Set();
    let counterFilter=new Set();
    let typeFilter=new Set();
    let textFilter="";
    let triggerFilter="";
    let featureFilter="";
    let nameFilter="";
    let sortMode_list=0;
    let regulationFilter_list=new Set();
    let colorFilter_list=new Set();
    let costFilter_list=new Set();
    let powerFilter_list=new Set();
    let counterFilter_list=new Set();
    let typeFilter_list=new Set();
    let textFilter_list="";
    let triggerFilter_list="";
    let featureFilter_list="";
    let nameFilter_list="";
    let currentList=[];
    let currentIndex=0;
    let startX=0;
    let leader_number = null;
    let colorFilter_leader=new Set();
    let nameFilter_leader="";
    let leaderFilterApplied=false;
    let gridCols=5;
    let gridCols_list=5;
    let gridCols_leader=5;
    
// ===== 初期画面 =====
    function initApp(){
        show("top");
    }

    // ===== 読み込み =====
    async function loadFromHandle(dir){
        if(!dir) return;
        data=[];
        for await(const entry  of dir.values()){
            if(entry.kind!=="file") continue;
            if(!entry.name.endsWith(".deck")) continue;
            const file = await entry.getFile();
            const text = await file.text();
            const lines = text.split("\n").filter(l=>l.trim());
            if(lines.length === 0) continue;
            const counts = {};
            let leader_number = null;
            lines.forEach((line, i)=>{
                const m = line.match(/(\d+)x(.+)/);
                if(!m) return;
                const num = Number(m[1]);
                const name = m[2];
                if(i === 0){
                    leader_number = name;
                }else{
                    counts[name] = num;
                }
            });
            
            if(!leader_number) continue;

            data.push({
                name: entry.name.replace(".deck",""),
                counts,
                leader_number
            });
        }
        renderList();
    }

// ===== 画面 =====
    function show(id){
        ["start","top","leader","edit","cardList"].forEach(x=>{
            document.getElementById(x).classList.add("hidden")
        });
        document.getElementById(id).classList.remove("hidden");
    }

// ===== 新規 =====
    function newData(){
        counts={};
        current=null;
        loadleader();
        show("leader");
    }

    function importDeck(){
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".deck";

        input.onchange = async ()=>{
            const file = input.files[0];
            if(!file) return;

            const text = await file.text();
            const lines = text.split("\n").filter(l=>l.trim());

            let counts = {};
            let leader_number = null;

            lines.forEach((line,i)=>{
                const m = line.match(/(\d+)x(.+)/);
                if(!m) return;

                const num = Number(m[1]);
                const cardName = m[2];

                const card = CARD_DATA.find(c=>c.name === cardName);
                if(!card) return;

                if(i===0){
                    leader_number = card.number;
                }else{
                    counts[card.number] = num;
                }
            });

            if(!leader_number){
                alert("リーダーが不明");
                return;
            }

            data.push({
                name: "import_" + Date.now(),
                counts,
                leader_number
            });

            saveAll();
        };

        input.click();
    }

        Object.keys(d.counts).forEach(number=>{
            const card = CARD_DATA.find(c=>c.number===number);
            if(!card) return;

            text += `${d.counts[number]}x${card.name}\n`;
        });

        const blob = new Blob([text], {type:"text/plain"});
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = d.name + ".deck";
        a.click();

        URL.revokeObjectURL(url);
    }

// ===== 操作 =====
    let pressTimer;

    function cardPress(el, onLongPress, onClick){
        let pressTimer;
        let startX = 0;
        let startY = 0;
        let moved = false;
        let longPressFired = false;

    // ===== スマホ =====
        el.addEventListener("touchstart", (e)=>{
            moved = false;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            pressTimer = setTimeout(()=>{
                if(!moved){
                    onLongPress();
                }
            }, 700);
        });

        el.addEventListener("touchmove", (e)=>{
            let dx = Math.abs(e.touches[0].clientX - startX);
            let dy = Math.abs(e.touches[0].clientY - startY);
            if(dx > 10 || dy > 10){
                moved = true;
                clearTimeout(pressTimer);
            }
        });

        el.addEventListener("touchend", ()=>{
            clearTimeout(pressTimer);
        });
        
        // ===== PC =====
        el.addEventListener("mousedown", ()=>{
            pressTimer = setTimeout(onLongPress, 700);
        });
        el.addEventListener("mouseup", ()=>{
            clearTimeout(pressTimer);
        });
        el.addEventListener("mouseleave", ()=>{
            clearTimeout(pressTimer);
        });

        // ===== 通常クリック =====
        el.addEventListener("click", (e)=>{
            onClick(e);
        });
    }

    function add(n){
        const card = card_list.find(c => c.number === n);
        if(!card) return;
        const max = SPECIAL_LIMIT[card.number] || 4;
        if((counts[n]||0)>=max)return;
        counts[n]=(counts[n]||0)+1;
        render();
        if(document.getElementById("viewer").classList.contains("show")){
            renderViewer();
        }
    }

    function remove(n){
        if(!counts[n]) return;
        counts[n]--;
        if(counts[n]<=0)delete counts[n];
        render();
        if(document.getElementById("viewer").classList.contains("show")){
            renderViewer();
        }
    }

        while(names.includes(base + "_" + i)){

        }
        return base + "_" + i;
    }

    function getColorCode(color){
        const map = {
            "赤":"#e74c3c",
            "青":"#3498db",
            "緑":"#27ae60",
            "黄":"#f1c40f",
            "紫":"#8e44ad",
            "黒":"#2c3e50"
        };
        return map[color] || "#999";
    }

    function analyzeDeck(){
        const result = {
            counter:{0:0,1000:0,2000:0},
            features:{},
            cost:{},
            colors:{}
        };

        Object.keys(counts).forEach(number=>{
            const card = card_list.find(c=>c.number===number);
            if(!card) return;

            const num = counts[number];

            // ===== カウンター =====
            if(result.counter[card.counter] != null){
                result.counter[card.counter] += num;
            }

            // ===== 特徴 =====
            if(card.feature){
                const arr = card.feature.split("/");
                arr.forEach(f=>{
                    f = f.trim();
                    if(!f) return;
                    result.features[f] = (result.features[f]||0) + num;
                });
            }

            // ===== コスト =====
            result.cost[card.cost] = (result.cost[card.cost]||0) + num;

            // ===== 色 =====
            card.color.forEach(c=>{
                result.colors[c] = (result.colors[c]||0) + num;
            });
        });

        return result;
    }

    function renderAnalysis(){
        const box = document.getElementById("deckAnalysis");
        const a = analyzeDeck();

        // ===== カウンター =====
        let counterHTML = `
            <h4>カウンター</h4>
            0: ${a.counter[0] || 0}枚<br>
            1000: ${a.counter[1000] || 0}枚<br>
            2000: ${a.counter[2000] || 0}枚
        `;

        // ===== 特徴 =====
        let featureHTML = `<h4>特徴</h4>`;
        Object.entries(a.features)
            .sort((a,b)=>b[1]-a[1])
            .forEach(([k,v])=>{
                featureHTML += `${k}: ${v}枚<br>`;
            });

        // ===== コスト =====
        const max = Math.max(...Object.values(a.cost), 1);
        let costHTML = `<h4>コスト分布</h4>`;
        for(let i=0;i<=10;i++){
            const v = a.cost[i] || 0;
            const ratio = (v / 50) * 90;

            costHTML += `
                <div style="display:flex;align-items:center;">
                    <div style="width:30px">${i}</div>
                    <div style="background:#007aff;height:8px;width:${ratio}%"></div>
                    <div style="margin-left:6px">${v}</div>
                </div>
            `;
        }

        box.innerHTML =
            counterHTML +
            featureHTML +
            costHTML +
            `<div style="height:80px"></div>`;
    }

    function makeChip(val,set,type,mode="edit"){
        let d=document.createElement("div");
        let isAllowed = true;

        if(type === "color" && mode === "edit"){
            const leader = leader_list.find(c => c.number === leader_number);
            isAllowed = !leader || leader.color.includes(val);

        d.className="chip"+(set.has(val)?" active":"");

            d.style.opacity = "0.3";
            d.style.pointerEvents = "none";
        }

        d.textContent=val;

        d.onclick=()=>{
            set.has(val)?set.delete(val):set.add(val);
            d.classList.toggle("active");
        };

        return d;
    }

        renderGrid();

        nameFilter_list=document.getElementById("nameSearch_list").value;

        textFilter_list=document.getElementById("textSearch_list").value;

    function closePopup(){
        document.getElementById("popup").classList.remove("show");
    }

    function closePopup_list(){
        document.getElementById("popup_list").classList.remove("show");
    }

// ===== Card 作成 =====
    function createCardElement(card,mode){
        let d = document.createElement("div");
        d.className = "card";

        let img = document.createElement("img");
        img.src = card.img;

        img.onerror = ()=>{
            img.src="";
            d.innerHTML += `<div class="noimg">No Image</div>`;
        };

        d.appendChild(img);

        //枚数表示（0/4）
        let count = counts[card.number] || 0;
        const total = getTotalCount();

        // ===== 選択済み or viewerだけUI表示 =====
        if(mode === "viewer"){
            const max = SPECIAL_LIMIT[card.number] || 4;
            let c = document.createElement("div");
            c.className = "count";
            c.textContent = count + "/" + max;
            d.appendChild(c);

            let addBtn = document.createElement("button");
            addBtn.className = "addBtn";
            addBtn.textContent = "+";
            addBtn.onclick = (e)=>{
                e.stopPropagation();
                add(card.number);
            };

            let removeBtn = document.createElement("button");
            removeBtn.className = "removeBtn";
            removeBtn.textContent = "-";
            removeBtn.onclick = (e)=>{
                e.stopPropagation();
                remove(card.number);
            };

            d.append(addBtn, removeBtn);
        }
        if(mode === "selected"){
            const max = SPECIAL_LIMIT[card.number] || 4;
            let c = document.createElement("div");
            c.className = "count";
            c.textContent = count + "/" + max;
            d.appendChild(c);
        }
        return d;
    }

    function getTotalCount(){
            return Object.values(counts).reduce((a,b)=>a+b,0);
    }
    
    function updateDeckCount(){
        const total = getTotalCount();
        const max = 50;

        const el = document.getElementById("deckCount");
        if(!el) return;
        el.textContent = `${total} / ${max}`;

        if(total !== max){
            el.style.color = "#ff4d4f";      // 赤
        }else{
            el.style.color = "#ffffff";      // 白
        }
    }

// ===== PWA =====
    function saveToLocal(){
        const payload = {
            data,
            counts,
            name,
            leader_number
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function loadFromLocal(){
        const raw = localStorage.getItem("deckAppData");
        if(!raw) return;

        try{
            const parsed = JSON.parse(raw);
            if(Array.isArray(parsed)){
                data = parsed;
            }else{
                data = parsed.data || [];
            }

        }catch(e){
            console.warn("load error", e);
            data = [];
        }
    }

    function getImg(card){
        if(!card || !card.img) return "";

        let path = card.img;

        if(path.startsWith("/")){
            path = path.slice(1);
        }

        return path;
    }

// ===== 初期化 =====
    loadFromLocal();
    renderList();

</script>
